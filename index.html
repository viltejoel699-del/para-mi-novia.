<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Corazones flotantes de fondo */
    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      animation: float 6s linear infinite;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .card-container {
      position: relative;
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    h1 {
      color: #e63946;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .message-box {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f5;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      border: 1px dashed #ffb3c1;
    }

    p.message {
      color: #4a4a4a;
      font-size: 1.1rem;
      line-height: 1.6;
      transition: opacity 0.4s ease;
    }

    .btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
      transition: background 0.2s, transform 0.2s;
    }

    .btn:hover {
      background: #d62828;
      transform: scale(1.05);
    }

    .counter {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Corazones animados en el fondo -->
  <script>
    for (let i = 0; i < 15; i++) {
      let heart = document.createElement('div');
      heart.className = 'heart-bg';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
      document.body.appendChild(heart);
    }
  </script>

  <div class="card-container">
    <h1>Tengo algo que decirte... ❤️</h1>
    
    <div class="message-box">
      <p class="message" id="msgText">Haz clic abajo para leer los mensajes que prepare para ti.</p>
    </div>

    <button class="btn" onclick="nextMessage()">Siguiente mensaje ✨</button>
    
    <div class="counter" id="counterText">Mensaje 1 de 4</div>
  </div>

  <script>
    // Personaliza aquí tus mensajes:
    const messages = [
      "¡Hola mi amor! Hice esta pequeña página solo para recordar lo mucho que te quiero. 🥰",
      "Gracias por cada sonrisa, cada momento y por acompañarme siempre. ❤️",
      "Cada día a tu lado es una razón más para sonreír. ¡Eres super especial para mí!",
      "Te quiero muchísimo. ¡Espero que te haya sacado una sonrisa! 😘"
    ];

    let index = 0;

    function nextMessage() {
      const msgEl = document.getElementById("msgText");
      const counterEl = document.getElementById("counterText");

      msgEl.style.opacity = 0;
      
      setTimeout(() => {
        index = (index + 1) % messages.length;
        msgEl.textContent = messages[index];
        counterEl.textContent = `Mensaje ${index + 1} de ${messages.length}`;
        msgEl.style.opacity = 1;
      }, 400);
    }
  </script>
</body>
</html>
